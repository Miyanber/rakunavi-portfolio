user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;
	# 圧縮失敗時は利用しない	
	gzip_disable "msie6";

	gzip_vary on;
	gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;

	#写真送信時などに、"request entity too large"と出るものの解決
	client_max_body_size 40M;

	# 診断
	log_format timed '$remote_addr - $request $status '
                 'rt=$request_time urt=$upstream_response_time '
                 'uht=$upstream_header_time uct=$upstream_connect_time '
                 'ua=$upstream_addr';
	access_log /var/log/nginx/access.timed.log timed;
	
	#Websocket診断のため
	log_format ws_debug '$remote_addr [$time_local] '
                    '"$request_method $request_uri" $status '
                    'Upgrade="$http_upgrade" Connection="$http_connection"';
	access_log /var/log/nginx/ws_debug.log ws_debug;

}


