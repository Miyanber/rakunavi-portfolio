{% comment %} プログラム表示・検索で利用する {% endcomment %}
{% load sports_fes_extras %}
<a class="card" href="{% url 'sports_fes:program_detail' program.number %}">
    <div class="card-back"></div>
    <div class="number"><span># {{ program.number }}</span></div>
    <div class="name"><span>{{ program.name }}</span></div>
    <div class="grade">
        <div class="grade-bars">
            {% for g in grade_meta %}
            <div class="grade-bar-wrap">
                <div
                    class="
                        grade-bar {{ program.target_grades }}
                        {% if g.num in program.target_grades %}
                            active
                        {% endif %}
                    "
                    style="--grade-color:#{{ g.color }}"
                    aria-label="{{ g.num }}年"
                ></div>
            </div>
            {% endfor %}
        </div>
    </div>
    <div class="enter">
        <span class="material-symbols-outlined">keyboard_double_arrow_right</span>
    </div>
</a>
