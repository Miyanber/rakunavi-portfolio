{% extends  "sports_fes/base.html" %}

{% load static %}

{% block title %}403 Forbidden (CSRF){% endblock %}

{% block extra_style %}
    <link rel="stylesheet" href="{% static 'sports_fes/css/error_page.css' %}">
{% endblock %}

{% block content %}
<article>
    <div class="title_box">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="m396-340 84-84 84 84 56-56-84-84 84-84-56-56-84 84-84-84-56 56 84 84-84 84 56 56Zm84 260q-139-35-229.5-159.5T160-516v-244l320-120 320 120v244q0 152-90.5 276.5T480-80Zm0-84q104-33 172-132t68-220v-189l-240-90-240 90v189q0 121 68 220t172 132Zm0-316Z"/></svg> 
        <h2>CSRFトークンの検証に失敗しました。</h2>
    </div>
    <div class="error-code"><p>403</p>Forbidden</div>
    <div class="contents_box">
        <p>セキュリティ上の理由から、リクエストは拒否されました。</p>
        <p>もう一度お試しください。</p>
    </div>
</article>

<script>
const el = document.querySelector(".title_box");
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      setTimeout(() => {
        entry.target.classList.add("is-visible");
      }, 800);
      observer.unobserve(entry.target);
    }
  });
});
observer.observe(el);
</script>

{% endblock %}
